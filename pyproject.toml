[project]
name = "architecture-mcp"
version = "0.1.0"
description = "Local MCP server for architecture compliance knowledge (SQLite-backed)."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
authors = [{ name = "ArchSolution" }]

dependencies = [
    "mcp>=1.2.0",
]

[project.scripts]
architecture-mcp = "architecture_mcp.server:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/architecture_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 110
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]
# UP042: `class X(str, enum.Enum)` is the canonical way to expose a string-backed
# enum that serializes cleanly to JSON in MCP tool responses (StrEnum also works,
# but mixing both across files would be worse). Keep the existing style.
ignore = ["E501", "UP042"]

[tool.uv]
package = true
